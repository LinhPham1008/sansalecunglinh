<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp Deal & Mã Giảm Giá</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ee4d2d; /* Màu cam đặc trưng của Shopee */
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        .banner-container {
            margin-bottom: 25px;
            text-align: center;
        }
        /* Style cho ảnh banner để luôn bo góc và tự động hiển thị đẹp trên mọi màn hình */
        .banner-container img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s ease-in-out;
        }
        .banner-container img:hover {
            transform: scale(1.02); /* Phóng to nhẹ khi di chuột vào */
        }
        .content {
            text-align: center;
        }
        .link-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #ee4d2d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
            box-sizing: border-box;
        }
        .link-button:hover {
            background-color: #d73d20;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Săn Deal Khủng Mỗi Ngày</h1>
        <p>Tổng hợp mã giảm giá và linh kiện PC giá tốt nhất</p>
    </div>

    <div class="banner-container">
        <a href="LINK_GROUP_CUA_BAN_VAO_DAY" target="_blank">
            <img src="https://sf-static.upanhlaylink.com/view/image_2026031629a1dfe8bc18a5690348e6a278a31a2d.jpg" alt="Banner Tham Gia Group">
        </a>
    </div>
    <div class="content">
        <h3>🔥 Deal Hot Hôm Nay 🔥</h3>
        
        <a href="LINK_SHOPEE_CUA_BAN_1" class="link-button" target="_blank">Deal VGA / Card Màn Hình</a>
        <a href="LINK_SHOPEE_CUA_BAN_2" class="link-button" target="_blank">Deal CPU / Mainboard</a>
        <a href="LINK_SHOPEE_CUA_BAN_3" class="link-button" target="_blank">Linh Kiện PC Khác</a>
    </div>

    <div class="footer">
        <p>Cập nhật liên tục 24/7. Chúc bạn săn sale thành công!</p>
    </div>
</div>

</body>
</html>
