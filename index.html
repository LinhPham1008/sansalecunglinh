<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Link Shopee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fbd6ca; /* Màu nền hồng đào giống ảnh */
            display: flex;
            justify-content: center;
            padding: 40px 15px;
            margin: 0;
            color: #333;
        }

        /* Phần Header Logo */
        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .page-header h2 {
            color: #ff5722;
            margin: 0 0 10px 0;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .domain-badge {
            background-color: #ffebd0; /* Màu nền mờ của tên miền */
            color: #ff5722;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }

        /* Khung nội dung chính */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Khu vực nhập link */
        .input-section {
            padding: 20px;
        }
        .input-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group {
            display: flex;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 14px;
            color: #555;
        }
        .input-group .paste-btn {
            background: #f9f9f9;
            border-left: 1px solid #e0e0e0;
            padding: 0 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #555;
        }
        
        .btn-submit {
            background-color: #ff5722;
            color: white;
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background-color: #e64a19;
        }

        /* Khu vực Hướng dẫn */
        .instruction-section {
            background-color: #f4f7f6; /* Màu nền xám xanh nhạt */
            padding: 20px;
        }
        .instruction-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            color: #1a73e8; /* Màu xanh của icon hướng dẫn */
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .instruction-title span {
            color: #333;
        }
        .instruction-list {
            margin: 0 0 15px 0;
            padding-left: 0;
            list-style: none;
            font-size: 13px;
            color: #444;
            line-height: 1.6;
        }
        .btn-fb {
            background-color: white;
            color: #1a73e8;
            border: 1px solid #1a73e8;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        /* Khu vực Mã giảm giá / Chèn ảnh */
        .banner-section {
            background-color: white;
            margin: 20px;
            border-radius: 8px;
        }
        .banner-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        /* Style cho ảnh của bạn */
        .custom-banner-img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: block;
        }
    </style>
</head>
<body>

<div>
    <div class="page-header">
        <h2><i class="fas fa-link"></i> Tạo Link Shopee</h2>
        <div class="domain-badge">cuongtws.xyz</div>
    </div>

    <div class="container">
        
        <div class="input-section">
            <div class="input-label"><i class="fas fa-lock"></i> Link sản phẩm Shopee</div>
            <div class="input-group">
                <input type="text" placeholder="Dán link Shopee vào đây...">
                <div class="paste-btn"><i class="fas fa-paste"></i></div>
            </div>
            <button class="btn-submit"><i class="fas fa-pen"></i> Tạo Link Ngay</button>
        </div>

        <div class="instruction-section">
            <div class="instruction-title"><i class="fas fa-info-circle"></i> <span>Hướng dẫn</span></div>
            <ul class="instruction-list">
                <li>1. Sau khi tạo link, nhấn <b>Copy Link</b>.</li>
                <li>2. Dán link dưới bình luận bài đăng này.</li>
                <li>3. Click vào link để mở Shopee sẽ nhận được mã.</li>
            </ul>
            <a href="#" class="btn-fb"><i class="fab fa-facebook"></i> Đến bài đăng Facebook</a>
        </div>

        <div class="banner-section">
            <div class="banner-title">Mã giảm giá/hoàn Xu</div>
            
            <a href="LINK_GROUP_CUA_BAN" target="_blank">
                <img src="https://sf-static.upanhlaylink.com/view/image_2026031629a1dfe8bc18a5690348e6a278a31a2d.jpg" alt="Banner Khuyến Mãi" class="custom-banner-img">
            </a>
            
        </div>
    </div>
</div>

</body>
</html>
